name: Propose a taxonomy change
description: Suggest a new topic, a rename, a merge or a change to related topics.
title: "[Taxonomy] "
labels: ["taxonomy"]
body:
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: "What should change in data/topics.yaml?" }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why, description: "Which researchers, papers or projects would this help classify? Links welcome." }
    validations: { required: true }
